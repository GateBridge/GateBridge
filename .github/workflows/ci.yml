name: Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  detect-jdk:
    name: Detect JDK Target
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.jdk-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up initial Java to read POM
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract target JDK from pom.xml
        id: jdk-matrix
        run: |
          TARGET_JDK=$(mvn help:evaluate -Dexpression=java.version.21 -q -DforceStdout 2>/dev/null || echo "21")
          if [ -z "$TARGET_JDK" ] || [ "$TARGET_JDK" = "null" ]; then
            TARGET_JDK="21"
          fi
          echo "Detected target JDK: $TARGET_JDK"
          echo "matrix={\"java\": [\"$TARGET_JDK\"]}" >> $GITHUB_OUTPUT

  validate-and-test:
    needs: detect-jdk
    name: Validate & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-jdk.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify compilation and run test suite
        run: mvn -B clean verify

      - name: Upload surefire test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/'
