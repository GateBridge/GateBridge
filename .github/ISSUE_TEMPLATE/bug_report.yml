name: Bug Report
description: File a bug report to help us reproduce and fix issues in GateBridge Core.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report an issue in GateBridge Core!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem clearly...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include logs, stack traces, or exception outputs).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Java version, OS, GateBridge version (e.g., Java 21, Linux Ubuntu 24.04, GateBridge 1.4.9).
      placeholder: e.g. Java 21 LTS, Linux, GateBridge 1.4.9
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Code / Steps
      description: Steps to reproduce the behavior or a minimal snippet.
    validations:
      required: false
